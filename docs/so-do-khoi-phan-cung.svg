<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- ==================== KHỐI NGUỒN ==================== -->
  <g id="block-power" transform="translate(415, 20)">
    <rect width="250" height="45" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="125" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Nguồn 5 V độc lập</text>
    <text x="125" y="35" text-anchor="middle" font-size="10" fill="#444444">(USB / Pin sạc dự phòng)</text>
  </g>

  <!-- Đường cấp nguồn nét đứt -->
  <path d="M 440 65 C 440 105, 260 105, 260 145" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <path d="M 540 65 L 540 465" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <path d="M 640 65 C 640 105, 850 105, 850 310" fill="none" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- ==================== KHỐI 1: THIẾT BỊ ĐEO NGỰC ==================== -->
  <g id="box-chest" transform="translate(25, 145)">
    <!-- Khung lớn nét đứt -->
    <rect width="470" height="520" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-dasharray="6,4"/>
    <rect x="15" y="-12" width="220" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="125" y="5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">KHỐI THIẾT BỊ ĐEO NGỰC</text>

    <!-- Sub-box: Đầu vào -->
    <rect x="15" y="25" width="440" height="145" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
    <text x="25" y="42" font-size="11" font-weight="bold" fill="#000000">Đầu vào</text>

    <!-- HC-SR04 -->
    <g transform="translate(30, 52)">
      <rect width="180" height="40" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="90" y="18" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">HC-SR04</text>
      <text x="90" y="32" text-anchor="middle" font-size="9.5" fill="#444444">(TRIG / ECHO)</text>
    </g>

    <!-- Cầu chia áp -->
    <g transform="translate(30, 107)">
      <rect width="180" height="45" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">Chia áp 3 × 1 kΩ</text>
      <text x="90" y="33" text-anchor="middle" font-size="9.5" fill="#000000">5 V → 3,3 V</text>
    </g>

    <!-- 4 Nút nhấn -->
    <g transform="translate(235, 52)">
      <rect width="205" height="100" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="102" y="18" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">4 nút nhấn chức năng</text>
      <text x="12" y="38" font-size="9.5" fill="#000000">• Nút SOS (giữ 1,5 s): GPIO 27</text>
      <text x="12" y="55" font-size="9.5" fill="#000000">• Nút PRIVACY: GPIO 14</text>
      <text x="12" y="72" font-size="9.5" fill="#000000">• Nút STOP: GPIO 12</text>
      <text x="12" y="89" font-size="9.5" fill="#000000">• Nút FIND: GPIO 33</text>
    </g>

    <path d="M 120 92 L 120 107" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="128" y="103" font-size="9" fill="#444444">ECHO</text>

    <!-- Vi điều khiển trung tâm: ESP32 DevKit -->
    <g transform="translate(45, 195)">
      <rect width="380" height="100" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
      <text x="190" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">ESP32 DevKit V1</text>
      <text x="190" y="42" text-anchor="middle" font-size="10.5" fill="#000000">vòng đo + cảnh báo</text>
      <text x="190" y="58" text-anchor="middle" font-size="10.5" fill="#000000">tác vụ mạng (FreeRTOS) · NVS</text>
      <text x="190" y="74" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">bộ phát ESP-NOW</text>
    </g>

    <path d="M 120 152 L 120 195" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="80" y="178" font-size="9.5" fill="#000000">ECHO (GPIO35)</text>

    <path d="M 185 195 L 185 92" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="190" y="178" font-size="9.5" fill="#000000">TRIG (GPIO32)</text>

    <path d="M 335 152 L 335 195" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Sub-box: Đầu ra -->
    <rect x="15" y="325" width="440" height="175" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
    <text x="25" y="342" font-size="11" font-weight="bold" fill="#000000">Đầu ra</text>

    <!-- Mô-tơ rung xúc giác -->
    <g transform="translate(30, 355)">
      <rect width="185" height="125" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="92" y="20" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">Mô-tơ rung xúc giác (Haptic)</text>
      <line x1="15" y1="28" x2="170" y2="28" stroke="#cccccc" stroke-width="1"/>
      <text x="12" y="48" font-size="9.5" fill="#000000">• Điều khiển: GPIO 25 (PWM)</text>
      <text x="12" y="65" font-size="9.5" fill="#000000">• Cảnh báo xúc giác cho người mù</text>
      <text x="12" y="82" font-size="9.5" fill="#000000">• Rung tăng dần theo độ gần</text>
      <text x="12" y="98" font-size="9.5" fill="#000000">  từ 120 cm xuống 40 cm</text>
    </g>

    <!-- Còi đơn nối trực tiếp (SINGLE_BUZZER) -->
    <g transform="translate(235, 355)">
      <rect width="205" height="125" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="102" y="20" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">Còi báo (SINGLE_BUZZER)</text>
      <line x1="15" y1="28" x2="190" y2="28" stroke="#cccccc" stroke-width="1"/>
      <text x="12" y="48" font-size="9.5" font-weight="bold" fill="#000000">• Nối trực tiếp: GPIO 13</text>
      <text x="12" y="65" font-size="9.5" font-weight="bold" fill="#000000">✓ KHÔNG DÙNG TRANSISTOR</text>
      <text x="12" y="82" font-size="9.5" fill="#000000">• Báo SOS, tìm gậy,</text>
      <text x="12" y="98" font-size="9.5" fill="#000000">  vật cản gần ≤ 40 cm</text>
    </g>

    <path d="M 120 295 L 120 355" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 335 295 L 335 355" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- ==================== KHỐI 2: CAMERA NGỰC ==================== -->
  <g id="box-cam" transform="translate(520, 465)">
    <rect width="210" height="200" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-dasharray="6,4"/>
    <rect x="15" y="-12" width="165" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="97" y="5" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">KHỐI CAMERA NGỰC</text>

    <g transform="translate(15, 20)">
      <rect width="180" height="165" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="90" y="22" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">ESP32-CAM + OV2640</text>
      <text x="90" y="38" text-anchor="middle" font-size="10" fill="#444444">(trên đế ESP32-CAM-MB)</text>
      <line x1="15" y1="46" x2="165" y2="46" stroke="#cccccc" stroke-width="1"/>
      <text x="12" y="65" font-size="9.5" fill="#000000">• Chế độ: CAMERA_ONLY</text>
      <text x="12" y="82" font-size="9.5" fill="#000000">• Không cắm nút/cảm biến</text>
      <text x="12" y="99" font-size="9.5" fill="#000000">• Polling nhận lệnh chụp</text>
      <text x="12" y="116" font-size="9.5" fill="#000000">• Chụp JPEG gửi lên server</text>
      <text x="12" y="133" font-size="9.5" fill="#000000">• Cấp nguồn qua micro-USB</text>
    </g>
  </g>

  <!-- ==================== KHỐI 3: THIẾT BỊ GẬY ==================== -->
  <g id="box-cane" transform="translate(755, 145)">
    <rect width="300" height="520" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-dasharray="6,4"/>
    <rect x="15" y="-12" width="200" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="115" y="5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">KHỐI THIẾT BỊ GẬY</text>

    <!-- ESP32-C3 Super Mini -->
    <g transform="translate(15, 20)">
      <rect width="270" height="110" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
      <text x="135" y="24" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">ESP32-C3 Super Mini</text>
      <text x="135" y="40" text-anchor="middle" font-size="10" fill="#444444">(Lõi đơn RISC-V 160 MHz)</text>
      <line x1="20" y1="48" x2="250" y2="48" stroke="#cccccc" stroke-width="1"/>
      <text x="15" y="66" font-size="10" font-weight="bold" fill="#000000">• Nhận ESP-NOW trực tiếp (0 ms offline)</text>
      <text x="15" y="82" font-size="10" fill="#000000">• Quản lý hiển thị OLED đa trang</text>
      <text x="15" y="98" font-size="10" fill="#000000">• Polling lệnh còi dự phòng qua Wi-Fi</text>
    </g>

    <!-- Nút bấm gậy -->
    <g transform="translate(15, 145)">
      <rect width="270" height="75" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="15" y="20" font-size="10.5" font-weight="bold" fill="#000000">Nút bấm điều khiển gậy</text>
      <text x="15" y="40" font-size="9.5" fill="#000000">• Nút rời ngoài (GPIO 10): Đổi trang / tắt còi</text>
      <text x="15" y="58" font-size="9.5" fill="#000000">• Nút BOOT trên bo (GPIO 9): Tắt còi tại chỗ</text>
    </g>
    <path d="M 150 145 L 150 130" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Màn hình OLED SSD1306 -->
    <g transform="translate(15, 235)">
      <rect width="270" height="130" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="135" y="20" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">Màn hình OLED 0.96" SSD1306</text>
      <text x="135" y="34" text-anchor="middle" font-size="9.5" fill="#444444">I2C: SDA (GPIO6), SCL (GPIO7)</text>
      <line x1="20" y1="40" x2="250" y2="40" stroke="#cccccc" stroke-width="1"/>
      <text x="12" y="56" font-size="9.5" font-weight="bold" fill="#000000">✓ Trang 0: Mã QR Cứu hộ SOS (link GPS)</text>
      <text x="12" y="74" font-size="9.5" fill="#000000">✓ Trang 1: Trạng thái Wi-Fi, IP, ESP-NOW</text>
      <text x="12" y="92" font-size="9.5" fill="#000000">✓ Trang 2: Danh bạ khẩn cấp người thân</text>
      <text x="12" y="110" font-size="9" fill="#555555">(Tự quay về mã QR sau 15 giây)</text>
    </g>
    <path d="M 150 130 L 150 235" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Còi báo tìm gậy -->
    <g transform="translate(15, 380)">
      <rect width="270" height="95" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
      <text x="135" y="22" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">Còi báo tìm gậy (Active Buzzer)</text>
      <line x1="20" y1="30" x2="250" y2="30" stroke="#cccccc" stroke-width="1"/>
      <text x="12" y="50" font-size="9.5" font-weight="bold" fill="#000000">• Nối trực tiếp: GPIO 5</text>
      <text x="12" y="68" font-size="9.5" fill="#000000">• Nhận lệnh FIND / SOS $\to$ Kêu 25 s</text>
      <text x="12" y="84" font-size="9" fill="#555555">• Nhịp đôi: 150 ms kêu / 80 ms nghỉ</text>
    </g>
    <path d="M 270 130 C 300 240, 300 320, 275 390" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- ==================== GIAO TIẾP VÔ TUYẾN ESP-NOW ==================== -->
  <path d="M 425 245 L 755 245" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="525" y="225" width="155" height="38" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="602" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#000000">ESP-NOW (2,4 GHz)</text>
  <text x="602" y="254" text-anchor="middle" font-size="9" fill="#000000">Trực tiếp · 0 ms · Offline</text>

  <!-- ==================== HẠ TẦNG CLOUD / MÁY CHỦ ==================== -->
  <g id="box-server" transform="translate(425, 715)">
    <rect width="250" height="70" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
    <text x="125" y="22" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">Máy chủ (Wi-Fi / HTTP / Cloud)</text>
    <line x1="20" y1="30" x2="230" y2="30" stroke="#cccccc" stroke-width="1"/>
    <text x="125" y="45" text-anchor="middle" font-size="9.5" fill="#000000">FastAPI · SQLite · SegFormer AI</text>
    <text x="125" y="58" text-anchor="middle" font-size="9" fill="#555555">https://iot.chongziapp.id.vn (VPS)</text>
  </g>

  <!-- Đường Wi-Fi -->
  <path d="M 260 295 C 260 720, 400 750, 425 750" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="310" y="710" font-size="9.5" fill="#000000">Wi-Fi</text>

  <path d="M 605 665 L 605 715" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="612" y="695" font-size="9.5" fill="#000000">Wi-Fi</text>

  <path d="M 850 130 C 850 720, 700 750, 675 750" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="730" y="735" font-size="9.5" fill="#000000">Wi-Fi</text>

</svg>
